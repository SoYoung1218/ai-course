<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스페이먼츠 주문서형 결제 테스트</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; }
        #payment-method, #agreement { margin-bottom: 20px; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
        button { width: 100%; padding: 15px; background-color: #0064ff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>결제 테스트</h1>
        <div id="payment-method"></div>
        <div id="agreement"></div>
        <button id="payment-button" disabled>결제하기</button>
    </div>

    <script>
        const clientKey = 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';
        const customerKey = TossPayments.ANONYMOUS;

        const tossPayments = TossPayments(clientKey);
        const widgets = tossPayments.widgets({ customerKey });

        // 1. 금액 설정
        widgets.setAmount({
            currency: "KRW",
            value: 1000
        });

        // 2. 결제 수단 렌더링
        widgets.renderPaymentMethods({
            selector: "#payment-method",
            variantKey: "DEFAULT"
        });

        // 3. 약관 렌더링
        const agreementWidget = widgets.renderAgreement({
            selector: "#agreement",
            variantKey: "AGREEMENT"
        });

        // 약관 동의 상태에 따라 결제 버튼 활성화/비활성화
        agreementWidget.on('agreementStatusChange', (event) => {
            const { agreedRequiredTerms } = event;
            document.getElementById('payment-button').disabled = !agreedRequiredTerms;
        });

        // 4. 결제 요청
        document.getElementById('payment-button').addEventListener('click', async () => {
            try {
                await widgets.requestPayment({
                    orderId: Math.random().toString(36).substring(2, 15),
                    orderName: "테스트 상품",
                    successUrl: window.location.origin + '/success.html',
                    failUrl: window.location.origin + '/fail.html',
                });
            } catch (error) {
                console.error('결제 요청 중 오류 발생:', error);
            }
        });
    </script>
</body>
</html>
