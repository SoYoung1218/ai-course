<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body class="container mt-5">
    <h1 class="mb-4">My Todo List</h1>

    <!-- 할 일 추가 폼 -->
    <div class="card mb-4">
        <div class="card-body">
            <form action="/add" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">설명</label>
                    <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="due_date" class="form-label">마감일</label>
                        <input type="date" class="form-control" id="due_date" name="due_date">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="priority" class="form-label">우선순위</label>
                        <select class="form-select" id="priority" name="priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">추가하기</button>
            </form>
        </div>
    </div>

    <!-- 할 일 목록 -->
    <ul class="list-group">
        {% for todo in todos %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div class="{% if todo.is_completed %}completed{% endif %}">
                    <h5 class="mb-1">{{ todo.title }}</h5>
                    <p class="mb-1 text-muted small">{{ todo.description }}</p>
                    <small>
                        마감일: {{ todo.due_date if todo.due_date else '없음' }} | 
                        우선순위: {{ todo.priority }}
                    </small>
                </div>
                <form action="{{ url_for('toggle_todo', todo_id=todo.id) }}" method="POST">
                    <button type="submit" class="btn btn-sm {% if todo.is_completed %}btn-secondary{% else %}btn-success{% endif %}">
                        {% if todo.is_completed %}취소{% else %}완료{% endif %}
                    </button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
